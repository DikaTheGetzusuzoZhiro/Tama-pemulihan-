<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAMA - Pemulihan Akun</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#7c3aed,#241044 38%,#08050d 78%);font-family:Arial,sans-serif;color:#fff}.wrap{width:100%;max-width:430px}.logo{text-align:center;font-size:30px;font-weight:900;letter-spacing:3px;margin-bottom:20px}.card{background:rgba(20,15,30,.9);border:1px solid #3b3150;border-radius:22px;padding:28px 24px;box-shadow:0 20px 70px #0008}.icon{width:68px;height:68px;border-radius:50%;background:#7c3aed;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:32px}h1{text-align:center;font-size:24px;margin:0 0 9px}.desc{text-align:center;color:#aaa;font-size:14px;line-height:1.6;margin:0 0 24px}label{display:block;font-size:13px;color:#ccc;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #41364e;background:#110d17;color:#fff;border-radius:12px;outline:0;font-size:15px;margin-bottom:14px}input:focus{border-color:#8b5cf6}button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.loading,.error{display:none;text-align:center;font-size:13px;margin-top:14px}.loading{color:#aaa}.error{color:#f87171}.result{display:none;text-align:center}.avatar{width:130px;height:130px;object-fit:cover;border-radius:18px;border:3px solid #8b5cf6;background:#18121f;margin:0 auto 16px;display:block}.username{font-size:20px;font-weight:800;margin-bottom:9px}.success{display:inline-block;padding:7px 12px;border-radius:20px;background:#22c55e1c;color:#4ade80;font-size:13px;margin-bottom:13px}.result p{color:#aaa;font-size:14px;line-height:1.6;margin:0 0 20px}.reset{background:#241d2d;border:1px solid #443850;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">TAMA</div>
<div class="card">
<div id="form">
<div class="icon">✓</div>
<h1>Pemulihan Akun</h1>
<p class="desc">Masukkan username Roblox untuk melanjutkan proses pemulihan akun.</p>
<label>Username Roblox</label>
<input id="username" placeholder="Contoh: Builderman" autocomplete="off">
<div id="error" class="error">Username tidak ditemukan.</div>
<button id="btn" onclick="recover()">Create</button>
<div id="loading" class="loading">Mencari akun dan avatar...</div>
</div>
<div id="result" class="result">
<img id="avatar" class="avatar" alt="Avatar Roblox">
<div id="name" class="username"></div>
<div class="success">✓ Akun berhasil dipulihkan</div>
<p>Proses pemulihan untuk akun ini telah selesai.</p>
<button onclick="location.reload()">Selesai</button>
</div>
</div>
</div>
<script>
async function recover(){
 const input=document.getElementById('username'), u=input.value.trim();
 const err=document.getElementById('error'),load=document.getElementById('loading'),btn=document.getElementById('btn');
 err.style.display='none';
 if(!u){err.textContent='Masukkan username terlebih dahulu.';err.style.display='block';return}
 btn.disabled=true;load.style.display='block';
 try{
   const r=await fetch('https://users.roblox.com/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[u],excludeBannedUsers:false})});
   const d=await r.json();
   if(!d.data||!d.data.length)throw new Error();
   const user=d.data[0];
   document.getElementById('name').textContent='@'+user.name;
   document.getElementById('avatar').src='https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+user.id+'&size=150x150&format=Png&isCircular=false';
   document.getElementById('form').style.display='none';
   document.getElementById('result').style.display='block';
 }catch(e){
   err.textContent='Username Roblox tidak ditemukan.';
   err.style.display='block';
 }finally{btn.disabled=false;load.style.display='none'}
}
document.getElementById('username').addEventListener('keydown',e=>{if(e.key==='Enter')recover()});
</script>
</body>
</html>
