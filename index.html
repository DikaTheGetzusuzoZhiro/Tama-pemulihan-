<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAMA • Pemulihan Roblox</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#7c3aed 0,#25113e 35%,#08050d 75%);font-family:Arial,sans-serif;color:#fff}.wrap{width:min(430px,100%)}.logo{text-align:center;font-weight:900;font-size:30px;letter-spacing:4px;margin-bottom:18px}.card{background:#15101dcc;border:1px solid #ffffff18;border-radius:22px;padding:28px 24px;box-shadow:0 20px 70px #0009;backdrop-filter:blur(12px)}.icon{width:68px;height:68px;margin:auto auto 18px;border-radius:50%;display:grid;place-items:center;background:#7c3aed;font-size:32px}h1{text-align:center;font-size:24px;margin:0 0 8px}.desc{text-align:center;color:#aaa;font-size:14px;line-height:1.55;margin:0 0 24px}label{display:block;color:#ccc;font-size:13px;margin-bottom:8px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #453953;background:#0f0b14;color:#fff;outline:0;font-size:15px;margin-bottom:12px}input:focus{border-color:#8b5cf6}button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.status{text-align:center;font-size:13px;color:#aaa;margin-top:14px;display:none}.error{text-align:center;font-size:13px;color:#f87171;margin-top:12px;display:none}.result{text-align:center;display:none}.avatar{width:150px;height:150px;object-fit:cover;border-radius:20px;border:3px solid #8b5cf6;display:block;margin:0 auto 16px;background:#21172c}.username{font-size:20px;font-weight:800;margin-bottom:10px}.ok{display:inline-block;padding:7px 12px;border-radius:20px;background:#22c55e1a;color:#4ade80;font-size:13px;margin-bottom:14px}.result p{color:#aaa;font-size:14px;line-height:1.55;margin:0 0 20px}.secondary{background:#241d2d;border:1px solid #443850}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">TAMA</div>
<div class="card">
<section id="form">
<div class="icon">✓</div>
<h1>Pemulihan Akun</h1>
<p class="desc">Masukkan username Roblox untuk menampilkan akun dan avatar.</p>
<label for="username">Username Roblox</label>
<input id="username" placeholder="Contoh: Builderman" autocomplete="off" maxlength="20">
<button id="btn">Create</button>
<div id="status" class="status">Mencari akun...</div>
<div id="error" class="error"></div>
</section>

<section id="result" class="result">
<img id="avatar" class="avatar" alt="Avatar Roblox">
<div id="display" class="username"></div>
<div class="ok">✓ Akun berhasil dipulihkan</div>
<p>Informasi akun berhasil ditemukan.</p>
<button class="secondary" onclick="location.reload()">Kembali</button>
</section>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
async function getJson(url,options={},tries=2){
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){if(i===tries-1)throw e;await new Promise(x=>setTimeout(x,700))}
  }
}
async function recover(){
  const username=$('username').value.trim();
  $('error').style.display='none';
  if(!username){$('error').textContent='Masukkan username terlebih dahulu.';$('error').style.display='block';return}
  $('btn').disabled=true;$('status').style.display='block';$('status').textContent='Mencari username Roblox...';
  try{
    // Endpoint resmi Roblox: username -> userId
    const u=await getJson('https://users.roblox.com/v1/usernames/users',{
      method:'POST',
      body:JSON.stringify({usernames:[username],excludeBannedUsers:false})
    });
    const user=u.data?.[0];
    if(!user) throw new Error('NOT_FOUND');

    $('status').textContent='Memuat avatar...';
    // Ambil URL gambar dari response thumbnail, bukan memakai endpoint JSON sebagai src gambar.
    const t=await getJson('https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds='+encodeURIComponent(user.id)+'&size=150x150&format=Png&isCircular=false&thumbnailType=HeadShot');
    const image=t.data?.[0]?.imageUrl;
    if(!image) throw new Error('NO_AVATAR');

    $('avatar').src=image;
    $('avatar').onerror=()=>{$('avatar').src='https://tr.rbxcdn.com/30DAY-AvatarHeadshot-150.png'};
    $('display').textContent='@'+user.name;
    $('form').style.display='none';
    $('result').style.display='block';
  }catch(e){
    $('error').textContent=e.message==='NOT_FOUND'?'Username Roblox tidak ditemukan.':'Gagal mengambil data Roblox. Coba lagi.';
    $('error').style.display='block';
  }finally{$('btn').disabled=false;$('status').style.display='none'}
}
$('btn').addEventListener('click',recover);
$('username').addEventListener('keydown',e=>{if(e.key==='Enter')recover()});
</script>
</body>
</html>
